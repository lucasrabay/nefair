# Configuracao da Etapa 0 - auditoria de metadados do corpus.
# Todos os parametros da auditoria vivem aqui para manter o script determinstico
# e a fonte de dados rastreavel.

dataset:
  id: nilc-nlp/CORAA-MUPE-ASR
  # Revisao (commit SHA ou tag) fixada para reprodutibilidade.
  # Deixe `null` para usar a revisao default do repositorio; a revisao
  # efetivamente resolvida (SHA) e sempre registrada no relatorio de saida.
  # PREENCHA com o SHA apos a primeira execucao para travar a fonte.
  revision: null
  splits:
    - train
    - validation
    - test

# Coluna(s) de audio a excluir da leitura (pesam GBs; nunca sao baixadas).
# A auditoria le apenas metadados via projecao de colunas do parquet.
audio_columns:
  - audio

# Mapa birth_state -> regiao.
# IMPORTANTE: a REGIAO deriva EXCLUSIVAMENTE de `birth_state`, nunca do prefixo
# de `speaker_code`. Estados nao listados aqui sao reportados como "fora de
# escopo" no relatorio (nunca dropados em silencio).
#
# As strings abaixo batem EXATAMENTE com os valores reais de `birth_state`
# (Title Case com "De"/"Do" maiusculos e acentos), conferidos na inspecao de
# schema. Nesta revisao aparecem, do Nordeste, apenas 7 dos 9 estados
# (Maranhao e Rio Grande Do Norte nao ocorrem); mantemo-los no mapa como
# definicao canonica da regiao. Um casing divergente em revisao futura seria
# capturado na lista de "fora de escopo" do relatorio.
region_map:
  # Nordeste (presentes nesta revisao: todos menos Maranhao e RN)
  Maranhão: NE
  Piauí: NE
  Ceará: NE
  Rio Grande Do Norte: NE
  Paraíba: NE
  Pernambuco: NE
  Alagoas: NE
  Sergipe: NE
  Bahia: NE
  # Sudeste (os 4 presentes)
  Minas Gerais: SE
  Espírito Santo: SE
  Rio De Janeiro: SE
  São Paulo: SE

# Bordas de bucket etario - PROVISORIO, nao travar aqui.
# A auditoria tambem emite a distribuicao etaria BRUTA por regiao
# (age_distribution_by_region.csv) para decidir os buckets depois de ver o
# confundidor (Nordeste mais jovem). Bordas semiabertas [inicio, fim).
# Primeira borda em 16 para cobrir a idade minima real de informante (16 anos);
# idades fora de [primeira, ultima) caem num bucket "fora_das_bordas" reportado.
age_buckets:
  edges: [16, 25, 35, 45, 60, 120]
